# Board description of the Xiaomi Mi 8 SE (sirius, SDM710), read by the unixnu build driver.
#
# Format 2: the ARM64, SoC, OS and device layers merge, and this file only states what the
# board changes. The prelink roots, slide, early security initializer, IPSW identity and the
# Apple device-tree properties come from the selected OS profile
# (profiles/os/ipados-17.7.11-21H461/profile.toml of UniXNU); the GIC, timer and CPU topology
# come from the sdm710 SoC profile and dts/sirius.dts.
#
# Bring-up stage: the XNU kernel reaches IOKit through the device's own U-Boot, which replaces
# the Mu-Silicium firmware step. There is no [firmware] table and no boot image on this port:
# UniXNU.efi is started by U-Boot from a FAT partition, DarwinBoot.efi travels in the payload
# volume as a [[driver]], and the payload FAT volume is flashed to the vendor partition
# (mmcblk0p80, 3 GiB).

schema_version = 2

[board]
name = "sirius"
soc = "SDM710"
soc_source = "sdm710"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Mi 8 SE"
kit = "sirius"

# ArmDTPlatform drives the platform expert from dts/sirius.dts. ArmCpu is the board's modified
# copy in drivers/ArmCpu (non-Apple timer INTID, /cpus probe counters, sheng-smp). DarwinBoot is
# the board's fork with the GIC-500 pre-configuration and the INTID 19 timer. XnuPrelink is the
# prelink kit the OS profile names.
[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "GopFramebuffer", "AppleKeyStoreState", "ShengHidInput"]

# The unchanged iPad7,1 iPadOS 17.7.11 restore image, the same target as fajita and sheng.
# SDM710 (Kryo 360, Cortex-A75/A55) is ARMv8.2 without pointer authentication, so it runs
# arm64 userlands only. The 21H461 kernelcache matches the XNU 23.6.0 source pinned by the
# OS profile and the prelink roots it selects.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

# The kernel step runs on macOS + Xcode (the CI workflow in this repository) or on Linux
# through scripts/linux of UniXNU. config_fragments apply in order, then defconfig overrides
# them: sirius keeps the first-console configuration of the legacy port.
[kernel]
defconfig = "sirius_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sdm710.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "component:AppleKeyStoreState",
  "component:ShengHidInput",          # board recipe scripts/build-sheng-hid-input.py; linked by the display archive below     # -Werror build and object audit of the keystore service; the late
                                     # display archive below links its own copy
  "build-native-legacy-display.py",   # the NativeLegacyDisplay / GopFramebuffer late archive
  "build-boot-progress.py",           # the boot progress display (kits/sirius, the readable kernel log)
  "build-sirius-pmgr.py",             # the ApplePMGRNub advertisement for AMFI (kits/sirius/SiriusPmgr.cpp)
  "build-sirius-usb.py",              # the CDC-ACM log console (kits/sirius/sirius_usb.c)
  "build-sirius-emmc.py",             # read-only SDCC1 probe (kits/sirius/sirius_emmc.c)
  "build-sirius-cpufreq.py",          # cpufreq-hw level request (kits/sirius/sirius_cpufreq.c)
  "build-sirius-touch.py",            # FTS521 touch probe on QUP1 SE1 (kits/sirius/sirius_touch.c)
  "build-sirius-gpu.py",              # Adreno 616 phase 1: CX power, GMU and GPU SMMU reads (kits/sirius/sirius_gpu.c)
  "build-native-emmc.py",             # the IOKit block driver (kits/sirius/NativeEmmc.cpp); its
                                     # IOStorageFamily imports are bound to the original kernelcache
]

# The hardware description handed to the payload step. dts/sirius.dts describes the board
# (memory, CPUs, PSCI, GIC); dts/sdm710.dtsi of the SoC profile carries the shared controller.
[device_tree]
source = "device:dts/sirius.dts"
include_dirs = ["soc:dts"]

# The payload volume: flashed to the vendor partition (mmcblk0p80, 3 GiB) as a FAT32 image and
# read by U-Boot. dram_size is the observed usable DRAM of the 6 GiB model: 2 GiB at 0x80000000
# plus 0xfd6c0000 at 0x100000000, and must equal the memory node of dts/sirius.dts.
# The userdata partition carries the Darwin root. The geometry below was read from the device
# itself (the SDCC1 probe parses the GPT): first/last LBA in 512-byte units as the GPT stores
# them, which is also this eMMC's logical block size.
[userdata]
first_lba = 0x1080000              # 17301504
last_lba = 0x747BFDE               # 122142686
lba_bytes = 512
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[payload]
# The two unchanged original trust-cache modules (StaticTrustCache and Cryptex1,SystemTrustCache)
# bundled byte for byte by UniXNU/scripts/build-original-system-trust.py. With it AMFI can trust the
# Apple-signed OS binaries instead of every exec being refused.
trust_cache_sha256 = ["7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7"]
volume = "SIRIUSESP"
size_mib = 256                      # 512 when a RAM Data seed (--data-ramdisk) travels in the volume; the persistent
                                    # Data container lives in userdata instead
loader = "payload"                  # not "firmware": unixnu.toml gets [[driver]] Payloads/DarwinBoot.efi
title = "sirius first boot: XNU to console"
dram_size = "0x17d6c0000"
panic_screen = true
# The OS profile's four fixups (a list here replaces the profile's), then one of this board's: without a
# Metal device CoreImage falls back to OpenGL, whose dispatch table is empty here, and iconservicesagent
# jumps to address 0 in CI::GLContext::init. The fifth entry replaces CoreUI's [CIContext
# contextWithOptions:] call in +[CUIShapeEffectStack sharedCIContext] (0x1a31d7b84 unslid, a bl) with
# mov x0, xzr: the shared context is nil, the glyph rasterizer returns no image and IconFoundation checks
# for that (cbz x26), so a vector symbol draws empty instead of killing the agent.
text_fixups = [
  "dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9",
  "dyld_shared_cache_arm64.13,1b05bec,44008052,24008052",
  "dyld_shared_cache_arm64.13,1b05b08,44008052,24008052",
  "BTAudioHALPlugin,38bec,ffc300d1f44f01a9,000080d2c0035fd6",
  "dyld_shared_cache_arm64.11,34f3b84,979701944914d794,e0031faa4914d794",
]
kernel_args = [
  "debug=0x14e",
  "kt_fixed_zones=120",
  "ml-timeout-lock-panic-scale=40",
  "-no_slto_panic",
  "boot-progress=2",                # draw the kernel console lines on the screen (the readable log)
  "sheng-smp=1",                    # ArmCpu claims every /cpus nub: without it AppleARMCPU (kernelcache) takes the secondary nubs and panics on the non-Apple tree
  "cpus=8",
  "armcpu-self-ipi=1",
  "armcpu-timer-intid=19",          # SDM670/710 virtual timer is GIC PPI 3 (INTID 19), not the architectural PPI 27
  "sheng-pmgr=2",                   # publish an ApplePMGRNub for the unchanged AMFI (kits/sirius/SiriusPmgr.cpp)
  "sirius_usb=2",                   # CDC-ACM log console over DWC3 (patches/xnu/sirius-usb-console.patch)
  "sirius_emmc_hs=3",              # card clock up to 100 MHz (1 = 25, 2 = 50, 3 = 100), each step proven
                                    # against blocks read at 400 kHz; falls back to the last good one
  "sirius_emmc_win=1",              # publish the SHNGROOT windows of [userdata] as block devices
  "launchdsuffix=release",          # DEVELOPMENT: load /sbin/launchd directly and report its errno
  "amfi_get_out_of_my_way=1",       # bring-up: let init exec from an unverified root
  "sirius-allow-unverified=1",      # bring-up: NativeEmmc authorizes the SystemOS union mount (no owner policy)
  "sirius-data-write=1",            # NativeEmmc publishes the persistent Data container behind the root image in
                                    # userdata read-write (scripts/make-data-window-image.py puts it there); the
                                    # transport refuses writes anywhere else
  "sheng-disable-watchdogd=1",      # package/BootWatchdogPolicy.c disables com.apple.watchdogd before launchd: it traps
                                    # (brk #1) without a watchdog backend and its exit panics the boot
  "sheng-lite=1",                   # the same policy also disables the network/iCloud/photo daemons this phone has no use
                                    # for, which compete with SpringBoard for memory and fill the small Data volume
  "sirius-skip-rootauth=1",         # the sealed-root answer needs the owner-root chain; see
  "offline-legacy-register=1",      # register GOP framebuffer service
  "offline-legacy-gop=1",           # enable hardware GOP mapping
  "offline-legacy-unit-scale=2",    # 2x display unit scale for high DPI
  "offline-legacy-pm=1",            # publish display PM states
  "offline-legacy-validate=1",      # validate swap requests
  "offline-legacy-transfer=1",      # transfer framebuffers
  "offline-legacy-cpu-present=1",   # CPU pixel copy presentation
  "sirius-fb-wc=1",                 # drivers/GopFramebuffer (board fork): map the scanout write-combined; uncached,
                                    # each full-frame CPU copy took 180-210 ms
  "sirius-fb-cached=1",             # and read the write-combined source surface through a cacheable mapping,
                                    # cleaned and invalidated before each copy
  "offline-legacy-phase=4",         # phase 4 display subsystem registration under /arm-io
  "offline-mobile-graphics-client=1", # support MobileGraphics client
  "offline-mobile-graphics-load=1", # load MobileGraphics
  "offline-apfs-load=1",            # load APFS
  "sheng-vsync=60",                 # 60 Hz software vsync heartbeat
                                    # patches/xnu/sirius-skip-rootauth.patch
  "sirius-cpufreq=1",               # kits/sirius/sirius_cpufreq.c: both clusters to their highest non-boost level;
                                    # the boot chain leaves the A75s at 300 MHz
  "offline-key-events=1",           # kits/sirius/KeyStoreProbe.cpp publishes the AppleKeyStoreState service
  "sheng-aks=1",                    # its user client answers the state queries (no passcode, unlocked): with
                                    # persistent Data SpringBoard does not finish booting without them
  "sirius-spawn-log=1",             # package/BootProgress.c: a SPAWN console line per exec and exit, with the second
  "sirius-touch=1",                 # package/sirius_touch.c: QUP1 SE1 I2C, FTS521 chip id, then the event FIFO
  "sirius-touch-hid=1",             # package/SiriusHidProbe.cpp: publish the touch screen (ShengHidInput) to iOS, as sheng's
                                    # combined keyboard+touch device (the in-kernel IOHIDEventDriver has no digitizer rule)
  "sheng-touch-hid=1",              # NativeHidInput: add the touch screen collection to that combined device
  "dk=0",                           # DriverKit off (gIODKDebug without kIODKEnable): dext personalities never match. With it on,
                                    # AppleUserHIDEventService took the touch screen and its AppleUserHIDDrivers server was never
                                    # launched (user server timeout); off, the in-kernel IOHIDEventDriver matches instead
  "sirius-skip-setup=1",            # package/BootWatchdogPolicy.c: write Setup's done flags (purplebuddy) and SpringBoard's
                                    # no-watchdog/no-dim prefs before launchd, so the boot goes past Setup to SpringBoard
  "sirius-gpu=1",                   # package/sirius_gpu.c: Adreno 616 phase 1 (CX GDSC, GMU clock, GMU/SMMU reads)
  "validation_disables=0x10",       # KF_STACKSHOT_OVRD: user stackshots return KERN_NOT_SUPPORTED. Watchdogs ask
                                    # for one before they kill a hung job, and on this port threads keep changing while
                                    # it runs, so the DEVELOPMENT check panics: "thread wait info count mismatch while
                                    # capturing snapshots" (kern_stackshot.c:3451), at 335 s
  # "sirius_usb_power=1",           # opt-in: power the USB GDSC and report the readback (proven safe).
  #                                 # 2/3/4 additionally touch the branch clocks; on SDM710 that stalls the
  #                                 # bus and reboots the phone unless the clock sources are programmed first.
]

# The platform identity seed (--unique-chip-id) is not stored in any repository; the first boot
# needs no seed, and chip_id is only used together with one.
[payload.adt]
chip_id = "8011"
# The OS volume of the 21H461 image set, so /chosen/root-matching selects the APFS volume the
# driver's OS window carries. The same value qualifies every device record of this OS profile.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
# The kernel's memory: DarwinBoot gives XNU one contiguous window of this size (256 MiB without
# it), placed in the first free run that fits. The largest free run on this unit is
# 0x9f800000+0xae9e7000 (2.73 GiB, to 0x14e1e7000; DarwinBoot's db-runs); 2.66 GiB leaves about
# 70 MiB of it for the allocations DarwinBoot makes after the window. The window crosses 4 GiB: the
# eMMC's 32-bit ADMA2 uses buffers allocated below 4 GiB (NativeEmmc bounce buffer with a physical
# mask, static descriptors in the kernel image) and refuses a page above it; the USB console checks
# its DMA address against the DWC3 address width. The firmware's reserved regions below
# 0x9f800000 are not available to any OS; what holds the 2.7 GiB above 0x14e1e7000 is not known yet.
owned_memory_size = "0xaa000000"

# The Apple device-tree properties the OS profile does not already supply. Its [adt] tables
# write /chosen, /product and the iPad7,1 identity (model iPad7,1, target-type J120); the board
# adds the suspend policy, its own product model and the button set (no Home button).
[adt.chosen.bytes]
# launchd's first boot task, mount -P 1, exits 66 without /chosen/boot-manifest-hash ("failed to
# get boot-manifest-hash"); it names /private/preboot/<hash> from it. There is no Apple
# personalization manifest here, so this is an explicit bring-up boot-set identity, not Apple data:
# the uke port's SHA-384 of "UkeBringup.BootSet.v1\0", the value asteroids also boots past mount with.
boot-manifest-hash = "5fd2fc139b688ddf071aa815c1ea75d26bcd994a528cf02e365661eab5139ec7b580d63ca9319e218962a2236f23faca"
# Zeroed report slot DarwinBoot fills with the final UEFI memory map before the hand-off (32 entries of start u64, bytes u64,
# EFI type u32, descriptors merged u32; drivers/DarwinBoot fork); the kernel logs it as NEMMC efi-map lines. It shows which
# firmware ranges keep the 2.7 GiB above 0x14e1e4000 out of XNU's one contiguous window.
darwinboot-efi-map = ""

[adt.chosen.u32]
# Bring-up: skip iOS's first-boot data migration. With /chosen/ephemeral-storage datamigrator skips every
# plugin (os_variant_uses_ephemeral_storage, found by the legacy port). On this phone the plugins wait on
# services it does not have until a watchdog kills them (signal 9), and the migration was still not done
# after 36 minutes at 87% idle. The cost: the staged system apps are not installed. Remove it to migrate.
ephemeral-storage = 1

[adt.product.string]
model = "xiaomi,sirius"
artwork-display-gamut = "sRGB"

[adt.defaults.u32]
sleep-disabled = 1                  # no suspend/resume on this board: do not let the CPU park forever

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2                # the non-mechanical answer BSPlatform passes through
